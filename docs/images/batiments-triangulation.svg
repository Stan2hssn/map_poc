<rect width="900" height="340" fill="#ffffff"/><circle cx="42" cy="40" r="13" fill="#1f2a44"/><text x="42" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text><text x="62" y="46" font-weight="bold" font-size="16">Le contour</text><polygon points="45.0,95.0 183.0,95.0 183.0,152.5 102.5,152.5 102.5,221.5 45.0,221.5" fill="#ffffff" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><circle cx="45" cy="95" r="4" fill="#1f2a44"/><text x="29" y="89" font-size="14" font-weight="bold">A</text><circle cx="183" cy="95" r="4" fill="#1f2a44"/><text x="189" y="89" font-size="14" font-weight="bold">B</text><circle cx="183" cy="152.5" r="4" fill="#1f2a44"/><text x="189" y="168.5" font-size="14" font-weight="bold">C</text><circle cx="102.5" cy="152.5" r="4" fill="#1f2a44"/><text x="110.5" y="146.5" font-size="14" font-weight="bold">D</text><circle cx="102.5" cy="221.5" r="4" fill="#1f2a44"/><text x="108.5" y="239.5" font-size="14" font-weight="bold">E</text><circle cx="45" cy="221.5" r="4" fill="#1f2a44"/><text x="29" y="239.5" font-size="14" font-weight="bold">F</text><text x="35" y="258" font-size="14">6 points, A à F</text><line x1="210" y1="125" x2="240" y2="125" stroke="#1f2a44" stroke-width="2" marker-end="url(#a)"/><circle cx="262" cy="40" r="13" fill="#1f2a44"/><text x="262" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text><text x="282" y="46" font-weight="bold" font-size="16">On coupe une oreille</text><polygon points="265.0,95.0 403.0,95.0 403.0,152.5 322.5,152.5 322.5,221.5 265.0,221.5" fill="#ffffff" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="265.0,95.0 403.0,95.0 403.0,152.5" fill="#f6d8a8" stroke="#3b5b9a" stroke-width="2" stroke-linejoin="round"/><circle cx="265" cy="95" r="4" fill="#1f2a44"/><text x="249" y="89" font-size="14" font-weight="bold">A</text><circle cx="403" cy="95" r="4" fill="#1f2a44"/><text x="409" y="89" font-size="14" font-weight="bold">B</text><circle cx="403" cy="152.5" r="4" fill="#1f2a44"/><text x="409" y="168.5" font-size="14" font-weight="bold">C</text><circle cx="322.5" cy="152.5" r="4" fill="#1f2a44"/><text x="330.5" y="146.5" font-size="14" font-weight="bold">D</text><circle cx="322.5" cy="221.5" r="4" fill="#1f2a44"/><text x="328.5" y="239.5" font-size="14" font-weight="bold">E</text><circle cx="265" cy="221.5" r="4" fill="#1f2a44"/><text x="249" y="239.5" font-size="14" font-weight="bold">F</text><text x="255" y="258" font-size="14">B fait une pointe :</text><text x="255" y="276" font-size="14">on coupe A-B-C</text><line x1="430" y1="125" x2="460" y2="125" stroke="#1f2a44" stroke-width="2" marker-end="url(#a)"/><circle cx="482" cy="40" r="13" fill="#1f2a44"/><text x="482" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text><text x="502" y="46" font-weight="bold" font-size="16">On recommence</text><polygon points="485.0,95.0 623.0,95.0 623.0,152.5 542.5,152.5 542.5,221.5 485.0,221.5" fill="#ffffff" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="485.0,95.0 623.0,95.0 623.0,152.5" fill="#dfe6f3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="485.0,95.0 623.0,152.5 542.5,152.5" fill="#f6d8a8" stroke="#3b5b9a" stroke-width="2" stroke-linejoin="round"/><circle cx="485" cy="95" r="4" fill="#1f2a44"/><text x="469" y="89" font-size="14" font-weight="bold">A</text><circle cx="623" cy="95" r="4" fill="#1f2a44"/><text x="629" y="89" font-size="14" font-weight="bold">B</text><circle cx="623" cy="152.5" r="4" fill="#1f2a44"/><text x="629" y="168.5" font-size="14" font-weight="bold">C</text><circle cx="542.5" cy="152.5" r="4" fill="#1f2a44"/><text x="550.5" y="146.5" font-size="14" font-weight="bold">D</text><circle cx="542.5" cy="221.5" r="4" fill="#1f2a44"/><text x="548.5" y="239.5" font-size="14" font-weight="bold">E</text><circle cx="485" cy="221.5" r="4" fill="#1f2a44"/><text x="469" y="239.5" font-size="14" font-weight="bold">F</text><text x="475" y="258" font-size="14">puis on coupe A-C-D</text><line x1="650" y1="125" x2="680" y2="125" stroke="#1f2a44" stroke-width="2" marker-end="url(#a)"/><circle cx="702" cy="40" r="13" fill="#1f2a44"/><text x="702" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">4</text><text x="722" y="46" font-weight="bold" font-size="16">Plus que des triangles</text><polygon points="705.0,95.0 843.0,95.0 843.0,152.5 762.5,152.5 762.5,221.5 705.0,221.5" fill="#ffffff" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="705.0,95.0 843.0,95.0 843.0,152.5" fill="#dfe6f3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="705.0,95.0 843.0,152.5 762.5,152.5" fill="#dfe6f3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="762.5,152.5 762.5,221.5 705.0,221.5" fill="#dfe6f3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="705.0,95.0 762.5,152.5 705.0,221.5" fill="#dfe6f3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><circle cx="705" cy="95" r="4" fill="#1f2a44"/><text x="689" y="89" font-size="14" font-weight="bold">A</text><circle cx="843" cy="95" r="4" fill="#1f2a44"/><text x="849" y="89" font-size="14" font-weight="bold">B</text><circle cx="843" cy="152.5" r="4" fill="#1f2a44"/><text x="849" y="168.5" font-size="14" font-weight="bold">C</text><circle cx="762.5" cy="152.5" r="4" fill="#1f2a44"/><text x="770.5" y="146.5" font-size="14" font-weight="bold">D</text><circle cx="762.5" cy="221.5" r="4" fill="#1f2a44"/><text x="768.5" y="239.5" font-size="14" font-weight="bold">E</text><circle cx="705" cy="221.5" r="4" fill="#1f2a44"/><text x="689" y="239.5" font-size="14" font-weight="bold">F</text><text x="695" y="258" font-size="14">4 triangles = 6 − 2</text><text x="30" y="320" font-size="14" font-style="italic">Une « oreille » : trois points qui se suivent, qui forment une pointe vers l'extérieur et ne contiennent aucun autre point.</text></svg>