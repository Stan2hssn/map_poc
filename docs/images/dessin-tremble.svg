<text x="40" y="392" font-size="14">Les bosses restent au même endroit de l'écran ;</text>
<text x="40" y="410" font-size="14">le trait glisse dessous et « nage ».</text>
<text x="480" y="392" font-size="14">Les bosses sont peintes sur la carte :</text>
<text x="480" y="410" font-size="14">elles voyagent avec le trait.</text>
<text x="30" y="456" font-size="14">La caméra bouge presque tout le temps (elle suit un peu la souris) : un tremblement accroché à l'écran</text>
<text x="30" y="476" font-size="14">ferait onduler toutes les arêtes en permanence. C'est le choix de droite qui est fait.</text>
