<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#222"/></marker>
  </defs>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Une étiquette = des petits rectangles découpés dans une planche</text>

  <!-- Planche -->
  <text x="40" y="72" font-size="16" font-weight="bold" fill="#222">1. La planche de caractères</text>
  <text x="40" y="92" font-size="14" fill="#555">105 caractères + un carré + un disque</text>
  <g font-size="22" font-weight="bold" fill="#1d2a4d" text-anchor="middle">
    <rect x="40" y="104" width="240" height="200" fill="#f4f4f4" stroke="#222"/>
    <g stroke="#cccccc" stroke-width="1">
      <line x1="80" y1="104" x2="80" y2="304"/><line x1="120" y1="104" x2="120" y2="304"/><line x1="160" y1="104" x2="160" y2="304"/>
      <line x1="200" y1="104" x2="200" y2="304"/><line x1="240" y1="104" x2="240" y2="304"/>
      <line x1="40" y1="144" x2="280" y2="144"/><line x1="40" y1="184" x2="280" y2="184"/><line x1="40" y1="224" x2="280" y2="224"/><line x1="40" y1="264" x2="280" y2="264"/>
    </g>
    <text x="60" y="132">A</text><text x="100" y="132">B</text><text x="140" y="132">C</text><text x="180" y="132">D</text><text x="220" y="132">E</text><text x="260" y="132">F</text>
    <text x="60" y="172">G</text><text x="100" y="172">H</text><text x="140" y="172">I</text><text x="180" y="172">J</text><text x="220" y="172">K</text><text x="260" y="172">L</text>
    <text x="60" y="212">M</text><text x="100" y="212">N</text><text x="140" y="212">O</text><text x="180" y="212">P</text><text x="220" y="212">Q</text><text x="260" y="212">R</text>
    <text x="60" y="252">S</text><text x="100" y="252">T</text><text x="140" y="252">É</text><text x="180" y="252">È</text><text x="220" y="252">Î</text><text x="260" y="252">…</text>
    <rect x="128" y="272" width="24" height="24" fill="#1d2a4d"/>
    <circle cx="180" cy="284" r="13" fill="#1d2a4d"/>
  </g>
  <rect x="81" y="185" width="38" height="38" fill="none" stroke="#b3452f" stroke-width="2.5"/>
  <text x="40" y="330" font-size="14" fill="#222">Chaque case : 48 px de lettre</text>
  <text x="40" y="348" font-size="14" fill="#222">+ 8 px de marge pour le dégradé.</text>

  <line x1="300" y1="200" x2="380" y2="200" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Etiquette -->
  <text x="400" y="72" font-size="16" font-weight="bold" fill="#222">2. L'étiquette posée sur la carte</text>
  <g>
    <!-- rectangles des lettres -->
    <g fill="none" stroke="#b3452f" stroke-width="1" stroke-dasharray="3 2">
      <rect x="469" y="132" width="32" height="38"/><rect x="493" y="132" width="20" height="38"/>
      <rect x="503" y="132" width="36" height="38"/><rect x="529" y="132" width="28" height="38"/>
      <rect x="547" y="132" width="26" height="38"/>
    </g>
    <text x="474" y="162" font-size="28" font-weight="bold" fill="#1d2a4d" >NÎMES</text>
    <rect x="474" y="170" width="70" height="2" fill="#1d2a4d"/>
    <rect x="473" y="172" width="2" height="118" fill="#1d2a4d"/>
    <circle cx="474" cy="290" r="8" fill="#1d2a4d"/>
  </g>
  <g font-size="14" fill="#222">
    <line x1="600" y1="150" x2="640" y2="150" stroke="#555"/><text x="646" y="155">une lettre = un rectangle (pointillé)</text>
    <line x1="550" y1="171" x2="640" y2="190" stroke="#555"/><text x="646" y="195">le filet : le carré plein, étiré</text>
    <line x1="480" y1="230" x2="640" y2="235" stroke="#555"/><text x="646" y="240">la tige : le même carré, étiré</text>
    <line x1="484" y1="290" x2="640" y2="280" stroke="#555"/><text x="646" y="285">le point : le disque</text>
  </g>
  <line x1="420" y1="300" x2="560" y2="300" stroke="#888" stroke-dasharray="5 4"/>
  <text x="400" y="330" font-size="14" fill="#222">Le point est accroché au sol, au centre de la ville. Le reste est mesuré</text>
  <text x="400" y="348" font-size="14" fill="#222">en pixels d'écran : le nom garde 15 px de haut, de près comme de loin.</text>
</svg>
