<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="sans-serif" font-size="15" fill="#222">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <linearGradient id="relief" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f4f4"/><stop offset="0.55" stop-color="#bbb"/><stop offset="1" stop-color="#666"/></linearGradient>
    <linearGradient id="orient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fd0e8"/><stop offset="0.5" stop-color="#a7a3ee"/><stop offset="1" stop-color="#e3a6d0"/></linearGradient>
    <linearGradient id="dist" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#222"/><stop offset="1" stop-color="#ddd"/></linearGradient>
    <pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#1d2a4d" stroke-width="2"/></pattern>
  </defs>
  <rect width="900" height="470" fill="#fff"/>
  <text x="30" y="36" font-size="20" font-weight="bold">Une image, deux temps : on photographie la maquette, puis on la redessine</text>

  <!-- 1 scene -->
  <rect x="30" y="70" width="190" height="190" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="44" y="96" font-weight="bold">1. La maquette 3D</text>
  <path d="M50,230 L110,140 L150,190 L175,160 L205,230 z" fill="#ddd" stroke="#222" stroke-width="2"/>
  <rect x="150" y="205" width="18" height="25" fill="#bbb" stroke="#222" stroke-width="1.5"/>
  <circle cx="190" cy="120" r="12" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="44" y="252" font-size="14">relief, bâti, soleil</text>

  <line x1="225" y1="165" x2="268" y2="165" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 hidden image -->
  <rect x="272" y="70" width="270" height="270" rx="8" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="286" y="96" font-weight="bold">2. Rendu dans une image cachée</text>
  <text x="286" y="116" font-size="14">(jamais montrée telle quelle)</text>
  <rect x="290" y="132" width="70" height="56" fill="url(#relief)" stroke="#222"/>
  <text x="372" y="156" font-size="14">couleurs et ombres</text>
  <text x="372" y="174" font-size="14" fill="#555">ce que voit l'œil</text>
  <rect x="290" y="198" width="70" height="56" fill="url(#orient)" stroke="#222"/>
  <text x="372" y="222" font-size="14">orientations</text>
  <text x="372" y="240" font-size="14" fill="#555">vers où pointe la surface</text>
  <rect x="290" y="264" width="70" height="56" fill="url(#dist)" stroke="#222"/>
  <text x="372" y="288" font-size="14">distances</text>
  <text x="372" y="306" font-size="14" fill="#555">loin de l'œil ou pas</text>

  <line x1="546" y1="205" x2="589" y2="205" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 ink pass -->
  <rect x="593" y="70" width="277" height="190" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="607" y="96" font-weight="bold">3. Passe d'encre</text>
  <text x="607" y="118" font-size="14">pour chaque pixel de l'écran :</text>
  <text x="617" y="142" font-size="14">• contour ? (saut de distance</text>
  <text x="629" y="160" font-size="14">ou d'orientation)</text>
  <text x="617" y="182" font-size="14">• clarté → hachures ou trame</text>
  <text x="617" y="204" font-size="14">• trait qui tremble</text>
  <text x="617" y="226" font-size="14">• posé sur papier et journal</text>

  <line x1="731" y1="262" x2="731" y2="300" stroke="#222" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 screen -->
  <rect x="593" y="304" width="277" height="140" rx="8" fill="#f1ece0" stroke="#222" stroke-width="2"/>
  <text x="607" y="330" font-weight="bold">4. L'écran</text>
  <path d="M615,425 L665,355 L700,395 L720,372 L748,425 z" fill="url(#h)" stroke="#1d2a4d" stroke-width="2"/>
  <rect x="770" y="350" width="86" height="26" fill="#fff" stroke="#222"/>
  <text x="780" y="368" font-size="14">Marseille</text>
  <text x="762" y="398" font-size="14">5. noms posés</text>
  <text x="762" y="416" font-size="14">par-dessus,</text>
  <text x="762" y="434" font-size="14">sans hachures</text>

  <!-- notes -->
  <text x="30" y="372" font-size="14">L'image cachée peut descendre à 60 % de la taille de l'écran</text>
  <text x="30" y="392" font-size="14">quand l'ordinateur peine. L'encre, elle, reste toujours à 100 % :</text>
  <text x="30" y="412" font-size="14">les traits restent nets.</text>
  <text x="30" y="444" font-size="14" font-weight="bold">Mode nuit : on saute l'étape 3, l'image 2 va droit à l'écran.</text>
</svg>
