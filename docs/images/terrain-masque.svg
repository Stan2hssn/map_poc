<text x="570" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222">Ellipse posée sur la carte</text>
<text x="570" y="112" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">centrée sur le point visé</text>
<text x="570" y="134" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">rayons : 70 en travers, 95 en profondeur</text>
<text x="570" y="156" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">(la zone de détail fait 100 de large)</text>
<text x="570" y="192" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222">Bord fondu et irrégulier</text>
<text x="570" y="214" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">le fondu commence à 40 % du rayon ;</text>
<text x="570" y="236" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">un bruit accroché à la carte</text>
<text x="570" y="258" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">froisse le bord de ±6 %</text>
<text x="570" y="294" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#c0392b">Rectangle rouge</text>
<text x="570" y="316" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">en mode encre, la grille ne couvre que</text>
<text x="570" y="338" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">le cadre de l'écran autour de l'ellipse :</text>
<text x="570" y="360" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">aucun point gaspillé au-dehors</text>
