<text x="60" y="395" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">1. On lit l'altitude un peu à gauche et un peu à droite du point (cercles blancs).</text>
<text x="60" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">2. La différence donne la pente (pointillés rouges), et la flèche qui lui est perpendiculaire.</text>
<text x="60" y="441" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">3. Plus cette flèche regarde vers le soleil, plus la surface est claire.</text>
