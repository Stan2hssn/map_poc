<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b5462f"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#fff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#222">La grille est collée à l'écran, le relief défile dessous</text>
  <text x="24" y="58" font-size="14" fill="#555">Vue de côté : l'œil de la caméra, l'écran, le sol</text>

  <!-- camera -->
  <rect x="44" y="106" width="36" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
  <path d="M80 112 L94 104 L94 136 L80 128 z" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="20" y="162" font-size="14" fill="#222">caméra</text>

  <!-- rays -->
  <g stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="94" y1="120" x2="704" y2="380"/>
    <line x1="94" y1="120" x2="526" y2="380"/>
    <line x1="94" y1="120" x2="427" y2="380"/>
    <line x1="94" y1="120" x2="364" y2="380"/>
    <line x1="94" y1="120" x2="320" y2="380"/>
    <line x1="94" y1="120" x2="288" y2="380"/>
  </g>

  <!-- screen -->
  <line x1="200" y1="150" x2="200" y2="290" stroke="#222" stroke-width="3"/>
  <g fill="#222">
    <circle cx="200" cy="165" r="5"/>
    <circle cx="200" cy="185" r="5"/>
    <circle cx="200" cy="205" r="5"/>
    <circle cx="200" cy="225" r="5"/>
    <circle cx="200" cy="245" r="5"/>
    <circle cx="200" cy="265" r="5"/>
  </g>
  <text x="96" y="312" font-size="14" fill="#222">écran :</text>
  <text x="96" y="330" font-size="14" fill="#222">points fixes</text>

  <!-- flat ground -->
  <line x1="240" y1="380" x2="860" y2="380" stroke="#222" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="720" y="402" font-size="14" fill="#555">sol plat (hauteur 0)</text>
  <g fill="#fff" stroke="#222" stroke-width="2">
    <circle cx="288" cy="380" r="4"/>
    <circle cx="320" cy="380" r="4"/>
    <circle cx="364" cy="380" r="4"/>
    <circle cx="427" cy="380" r="4"/>
    <circle cx="526" cy="380" r="4"/>
    <circle cx="704" cy="380" r="4"/>
  </g>

  <!-- relief -->
  <polyline points="250,374 288,360 320,335 364,310 427,325 526,285 610,322 704,350 790,372 860,376" fill="none" stroke="#b5462f" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#b5462f" stroke-width="2" fill="none">
    <line x1="288" y1="376" x2="288" y2="366" marker-end="url(#b)"/>
    <line x1="320" y1="376" x2="320" y2="341" marker-end="url(#b)"/>
    <line x1="364" y1="376" x2="364" y2="316" marker-end="url(#b)"/>
    <line x1="427" y1="376" x2="427" y2="331" marker-end="url(#b)"/>
    <line x1="526" y1="376" x2="526" y2="291" marker-end="url(#b)"/>
    <line x1="704" y1="376" x2="704" y2="356" marker-end="url(#b)"/>
  </g>
  <text x="540" y="276" font-size="14" fill="#b5462f">relief : altitudes lues dans une image</text>

  <!-- slide arrow -->
  <line x1="800" y1="440" x2="300" y2="440" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="466" font-size="14" fill="#222">on tire la carte : le relief glisse sous les points, qui ne bougent pas</text>

  <!-- steps -->
  <g font-size="15" fill="#222">
    <circle cx="474" cy="96" r="12" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="469" y="101" font-size="14">1</text>
    <text x="494" y="101">Un point de la grille, sur l'écran</text>
    <circle cx="474" cy="128" r="12" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="469" y="133" font-size="14">2</text>
    <text x="494" y="133">On tire un rayon jusqu'au sol plat</text>
    <circle cx="474" cy="160" r="12" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="469" y="165" font-size="14">3</text>
    <text x="494" y="165">On lit l'altitude à cet endroit</text>
    <circle cx="474" cy="192" r="12" fill="#fff" stroke="#b5462f" stroke-width="2"/>
    <text x="469" y="197" font-size="14" fill="#b5462f">4</text>
    <text x="494" y="197" fill="#b5462f">On soulève le point d'autant</text>
  </g>
</svg>
