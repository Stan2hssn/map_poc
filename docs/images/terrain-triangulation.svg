<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect width="900" height="440" fill="#ffffff"/>
<text x="450" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#222">Couper chaque carré en deux triangles</text>
<path d="M70,360 L210,360 L70,220 Z" fill="#f3d9d5" stroke="#222" stroke-width="2"/>
<text x="116.66666666666667" y="318.3333333333333" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#c0392b">A</text>
<path d="M210,360 L210,220 L70,220 Z" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<text x="163.33333333333334" y="271.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#555">B</text>
<path d="M210,360 L350,360 L210,220 Z" fill="#f3d9d5" stroke="#222" stroke-width="2"/>
<text x="256.6666666666667" y="318.3333333333333" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#c0392b">C</text>
<path d="M350,360 L350,220 L210,220 Z" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<text x="303.3333333333333" y="271.6666666666667" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#555">D</text>
<path d="M70,220 L210,220 L70,80 Z" fill="#f3d9d5" stroke="#222" stroke-width="2"/>
<text x="116.66666666666667" y="178.33333333333334" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#c0392b">E</text>
<path d="M210,220 L210,80 L70,80 Z" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<text x="163.33333333333334" y="131.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#555">F</text>
<path d="M210,220 L350,220 L210,80 Z" fill="#f3d9d5" stroke="#222" stroke-width="2"/>
<text x="256.6666666666667" y="178.33333333333334" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#c0392b">G</text>
<path d="M350,220 L350,80 L210,80 Z" fill="#e8e8e8" stroke="#222" stroke-width="2"/>
<text x="303.3333333333333" y="131.66666666666669" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#555">H</text>
<circle cx="70" cy="360" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="70" y="365" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">0</text>
<circle cx="210" cy="360" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="210" y="365" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">1</text>
<circle cx="350" cy="360" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="350" y="365" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">2</text>
<circle cx="70" cy="220" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="70" y="225" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">3</text>
<circle cx="210" cy="220" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="210" y="225" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">4</text>
<circle cx="350" cy="220" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="350" y="225" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">5</text>
<circle cx="70" cy="80" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="70" y="85" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">6</text>
<circle cx="210" cy="80" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="210" y="85" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">7</text>
<circle cx="350" cy="80" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="350" y="85" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">8</text>
<text x="210" y="405" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#555">bas de l'écran</text>
<line x1="30" y1="360" x2="30" y2="80" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
<text transform="rotate(-90 22 220)" x="22" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#555">rangées</text>
<text x="430" y="90" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222">1. On numérote les points</text>
<text x="430" y="114" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">rangée par rangée, de gauche à droite :</text>
<text x="430" y="138" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#c0392b">numéro = rangée × 3 + colonne</text>
<text x="430" y="172" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222">2. Chaque carré donne deux triangles</text>
<text x="430" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">carré dont le coin bas-gauche est a :</text>
<text x="430" y="220" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#c0392b">(a, a+1, a+3) et (a+1, a+4, a+3)</text>
<text x="430" y="248" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">carré 0 :  A = (0, 1, 3)   B = (1, 4, 3)</text>
<text x="430" y="272" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">carré 1 :  C = (1, 2, 4)   D = (2, 5, 4)</text>
<text x="430" y="296" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">carré 3 :  E = (3, 4, 6)   F = (4, 7, 6)</text>
<text x="430" y="320" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">carré 4 :  G = (4, 5, 7)   H = (5, 8, 7)</text>
<text x="430" y="354" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="bold" fill="#222">3. On ne stocke que la liste des numéros</text>
<text x="430" y="378" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">9 points, 4 carrés, 8 triangles, 24 numéros.</text>
<text x="430" y="402" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">Un point sert à jusqu'à 6 triangles :</text>
<text x="430" y="426" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">on le déplace une fois, tous suivent.</text>
</svg>
