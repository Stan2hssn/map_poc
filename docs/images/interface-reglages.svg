<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="sans-serif">
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="20" font-weight="bold" fill="#222">Un réglage, de ton curseur jusqu'au site en ligne</text>

  <!-- zone dev -->
  <rect x="30" y="60" width="820" height="230" fill="#f6f6f6" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="84" font-size="15" font-weight="bold" fill="#222">Sur ton ordinateur, pendant qu’on construit la carte</text>

  <!-- navigateur -->
  <rect x="50" y="100" width="250" height="170" fill="#fff" stroke="#222" stroke-width="2"/>
  <line x1="50" y1="122" x2="300" y2="122" stroke="#222" stroke-width="1.5"/>
  <text x="60" y="116" font-size="14" fill="#444">la carte, avec ?debug</text>
  <rect x="190" y="132" width="100" height="80" fill="#eee" stroke="#222" stroke-width="1.5"/>
  <text x="240" y="150" font-size="14" fill="#222" text-anchor="middle">panneau</text>
  <line x1="200" y1="166" x2="280" y2="166" stroke="#222"/><circle cx="250" cy="166" r="5" fill="#222"/>
  <line x1="200" y1="186" x2="280" y2="186" stroke="#222"/><circle cx="222" cy="186" r="5" fill="#222"/>
  <rect x="60" y="222" width="230" height="38" fill="#eee" stroke="#222" stroke-width="1.5"/>
  <text x="70" y="238" font-size="14" fill="#222">timeline SONDE</text>
  <path d="M120,254 l20,-10 l30,6 l40,-12" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="70" y="170" font-size="14" fill="#222">tu bouges</text>
  <text x="70" y="186" font-size="14" fill="#222">un curseur</text>

  <!-- serveur -->
  <rect x="380" y="140" width="170" height="80" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="465" y="174" font-size="14" fill="#222" text-anchor="middle">serveur local</text>
  <text x="465" y="194" font-size="14" fill="#444" text-anchor="middle">(SONDE branché)</text>
  <line x1="300" y1="180" x2="376" y2="180" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <text x="338" y="170" font-size="14" fill="#222" text-anchor="middle">envoie</text>

  <!-- fichiers -->
  <path d="M640,110 h120 l20,20 v50 h-140 z" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="710" y="146" font-size="14" fill="#222" text-anchor="middle">fichier des</text>
  <text x="710" y="164" font-size="14" fill="#222" text-anchor="middle">réglages</text>
  <path d="M640,196 h120 l20,20 v50 h-140 z" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="710" y="232" font-size="14" fill="#222" text-anchor="middle">fichier de la</text>
  <text x="710" y="250" font-size="14" fill="#222" text-anchor="middle">timeline</text>
  <line x1="550" y1="170" x2="636" y2="145" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="550" y1="190" x2="636" y2="230" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <text x="590" y="140" font-size="14" fill="#222" text-anchor="middle">écrit</text>

  <!-- git -->
  <line x1="710" y1="270" x2="710" y2="336" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <text x="698" y="310" font-size="14" fill="#222" text-anchor="end">on enregistre une version</text>

  <!-- branches -->
  <text x="46" y="330" font-size="15" font-weight="bold" fill="#222">Les trois branches, chacune mise en ligne par Vercel</text>
  <rect x="560" y="344" width="290" height="52" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="705" y="366" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">develop</text>
  <text x="705" y="385" font-size="14" fill="#444" text-anchor="middle">on travaille ici</text>
  <rect x="300" y="344" width="200" height="52" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="400" y="366" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">staging</text>
  <text x="400" y="385" font-size="14" fill="#444" text-anchor="middle">on vérifie ici</text>
  <rect x="40" y="344" width="200" height="52" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="140" y="366" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">prod</text>
  <text x="140" y="385" font-size="14" fill="#444" text-anchor="middle">le public voit ça</text>
  <line x1="558" y1="370" x2="504" y2="370" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="298" y1="370" x2="244" y2="370" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>

  <!-- prod -->
  <line x1="140" y1="398" x2="140" y2="436" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="40" y="440" width="810" height="100" fill="#f6f6f6" stroke="#222" stroke-width="1.5"/>
  <text x="56" y="464" font-size="15" font-weight="bold" fill="#222">Le site construit</text>
  <text x="56" y="488" font-size="14" fill="#222">• les deux fichiers sont recopiés DANS le code du site : rien à télécharger, rien à attendre</text>
  <text x="56" y="508" font-size="14" fill="#222">• SONDE n'est pas là (outil privé, l'hébergeur n'y a pas accès) ; le panneau ?debug s'ouvre encore,</text>
  <text x="70" y="526" font-size="14" fill="#222">mais ce qu'on y bouge n'est enregistré nulle part</text>
</svg>
