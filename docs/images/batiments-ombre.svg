<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="sans-serif" font-size="15" fill="#1f2a44">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a44"/></marker></defs>
<rect width="860" height="360" fill="#ffffff"/><text x="30" y="40" font-weight="bold" font-size="16">L'ombre est calculée une fois, carreau par carreau, en partant du côté du soleil</text><circle cx="70" cy="69" r="22" fill="#f6d8a8" stroke="#1f2a44" stroke-width="2"/><text x="40" y="112" font-size="14">soleil</text><polygon points="150.0,250.0 202.0,250.0 202.0,130.0 150.0,130.0" fill="#ece8e1" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="40" y="200" font-size="14">immeuble</text><text x="40" y="218" font-size="14">de 20 m</text><line x1="105" y1="205" x2="146" y2="205" stroke="#1f2a44" stroke-width="1.5" marker-end="url(#a)"/><text x="30" y="276" font-size="14">ombre</text><text x="30" y="292" font-size="14">sous (m)</text><line x1="70" y1="69" x2="202" y2="130" stroke="#c99a3c" stroke-width="2" stroke-dasharray="6 4"/><line x1="202" y1="130" x2="462" y2="250" stroke="#c99a3c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><polygon points="202.0,250.0 202.0,130.0 462.0,250.0" fill="#9aa0ad" stroke="none" stroke-width="2" stroke-linejoin="round" fill-opacity="0.35"/><line x1="30" y1="250" x2="830" y2="250" stroke="#1f2a44" stroke-width="2"/><polygon points="150.0,250.0 202.0,250.0 202.0,290.0 150.0,290.0" fill="#e8e2d6" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="176" y="276" font-size="15" font-weight="bold" text-anchor="middle">20</text><polygon points="202.0,250.0 254.0,250.0 254.0,290.0 202.0,290.0" fill="#d9dce3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="228" y="276" font-size="15" font-weight="bold" text-anchor="middle">16</text><polygon points="254.0,250.0 306.0,250.0 306.0,290.0 254.0,290.0" fill="#d9dce3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="280" y="276" font-size="15" font-weight="bold" text-anchor="middle">12</text><polygon points="306.0,250.0 358.0,250.0 358.0,290.0 306.0,290.0" fill="#d9dce3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="332" y="276" font-size="15" font-weight="bold" text-anchor="middle">8</text><polygon points="358.0,250.0 410.0,250.0 410.0,290.0 358.0,290.0" fill="#d9dce3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="384" y="276" font-size="15" font-weight="bold" text-anchor="middle">4</text><polygon points="410.0,250.0 462.0,250.0 462.0,290.0 410.0,290.0" fill="#ffffff" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="436" y="276" font-size="15" font-weight="bold" text-anchor="middle">0</text><polygon points="462.0,250.0 514.0,250.0 514.0,290.0 462.0,290.0" fill="#ffffff" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><text x="488" y="276" font-size="15" font-weight="bold" text-anchor="middle">0</text><text x="150" y="316" font-size="14">Chaque carreau note « à l'ombre sous X m » : le voisin côté soleil, moins 4 m par carreau.</text><text x="150" y="338" font-size="14" font-style="italic">Exemple : soleil à 45°, carreau de 4 m. Un point au sol (0 m) sous 16 m est à l'ombre.</text><text x="560" y="110" font-size="14">Ensuite, à chaque image, un pixel</text><text x="560" y="130" font-size="14">n'a qu'à lire son carreau et</text><text x="560" y="150" font-size="14">comparer avec sa propre hauteur.</text><text x="560" y="170" font-size="14">Une lecture au lieu d'un trajet</text><text x="560" y="190" font-size="14">vers le soleil.</text></svg>