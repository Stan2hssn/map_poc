<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Deux règles simples pour que le trafic ait l’air vrai</text>
  <text x="40" y="66" font-size="17" font-weight="bold" fill="#222">A. La boucle sans saut</text>
  <path d="M700,118 C700,60 100,60 100,118" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#fl)"/>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#555">arrivée au bout : elle repart du début</text>
  <line x1="80" y1="140" x2="720" y2="140" stroke="#bbb" stroke-width="16" stroke-linecap="round"/>
  <line x1="80" y1="140" x2="720" y2="140" stroke="#222" stroke-width="2"/>
  <text x="80" y="176" font-size="14" fill="#222" text-anchor="middle">début</text>
  <text x="720" y="176" font-size="14" fill="#222" text-anchor="middle">fin</text>
  <g fill="#c0392b" stroke="#222" stroke-width="1">
    <rect x="100" y="138" width="4" height="4"/>
    <rect x="128" y="135" width="12" height="10"/>
    <rect x="158" y="132" width="22" height="16"/>
    <rect x="620" y="132" width="22" height="16"/>
    <rect x="662" y="135" width="12" height="10"/>
    <rect x="696" y="138" width="4" height="4"/>
  </g>
  <text x="80" y="204" font-size="14" fill="#222">20 premiers m : elle grandit</text>
  <text x="720" y="204" font-size="14" fill="#222" text-anchor="end">20 derniers m : elle rapetisse</text>
  <line x1="40" y1="228" x2="760" y2="228" stroke="#ddd"/>
  <text x="40" y="256" font-size="17" font-weight="bold" fill="#222">B. Chacun roule à droite (vue de dessus)</text>
  <line x1="80" y1="320" x2="720" y2="320" stroke="#bbb" stroke-width="40"/>
  <line x1="80" y1="320" x2="720" y2="320" stroke="#222" stroke-width="1.5" stroke-dasharray="10 8"/>
  <text x="730" y="325" font-size="14" fill="#555">axe</text>
  <rect x="300" y="330" width="40" height="18" fill="#c0392b" stroke="#222"/>
  <line x1="350" y1="339" x2="420" y2="339" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <rect x="460" y="292" width="40" height="18" fill="#1a4f8a" stroke="#222"/>
  <line x1="450" y1="301" x2="380" y2="301" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <text x="140" y="378" font-size="14" fill="#222">décalée de 3,2 m à droite de son sens de marche</text>
  <text x="140" y="398" font-size="14" fill="#555">même règle pour tous : les deux sens se croisent sans se toucher</text>
  <text x="40" y="278" font-size="14" fill="#555">route à double sens : une voiture sur deux part dans l'autre sens</text>
</svg>
