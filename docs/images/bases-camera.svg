<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="440" fill="#ffffff"/>
<text x="450" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">La caméra : projeter la 3D sur un écran plat (vue de côté)</text>
<!-- sol -->
<line x1="40" y1="330" x2="860" y2="330" stroke="#222" stroke-width="2"/>
<text x="820" y="354" font-size="14" text-anchor="end" fill="#555">le sol de la scène</text>
<!-- oeil -->
<circle cx="90" cy="120" r="14" fill="#fff" stroke="#222" stroke-width="2.5"/>
<circle cx="96" cy="122" r="5" fill="#222"/>
<text x="90" y="92" font-size="14" text-anchor="middle" fill="#222">caméra</text>
<!-- cone de vision -->
<line x1="104" y1="124" x2="860" y2="150" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="104" y1="126" x2="300" y2="330" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>
<!-- ecran -->
<line x1="230" y1="128" x2="230" y2="258" stroke="#222" stroke-width="3"/>
<text x="230" y="276" font-size="14" text-anchor="middle" fill="#222">l'écran</text>
<!-- arbre proche -->
<line x1="420" y1="330" x2="420" y2="262" stroke="#222" stroke-width="3"/>
<circle cx="420" cy="250" r="18" fill="#e8e4da" stroke="#222" stroke-width="2"/>
<line x1="104" y1="124" x2="420" y2="232" stroke="#b03a2e" stroke-width="1.5"/>
<line x1="104" y1="126" x2="420" y2="330" stroke="#b03a2e" stroke-width="1.5"/>
<!-- arbre loin -->
<line x1="760" y1="330" x2="760" y2="262" stroke="#222" stroke-width="3"/>
<circle cx="760" cy="250" r="18" fill="#e8e4da" stroke="#222" stroke-width="2"/>
<line x1="104" y1="124" x2="760" y2="232" stroke="#3b6ea5" stroke-width="1.5"/>
<line x1="104" y1="126" x2="760" y2="330" stroke="#3b6ea5" stroke-width="1.5"/>
<!-- images sur ecran -->
<line x1="226" y1="167" x2="226" y2="207" stroke="#b03a2e" stroke-width="6"/>
<line x1="234" y1="145" x2="234" y2="165" stroke="#3b6ea5" stroke-width="6"/>
<text x="40" y="300" font-size="14" fill="#222">taille sur l'écran :</text><text x="40" y="318" font-size="14" fill="#222">proche 40 px, loin 20 px</text>
<text x="420" y="378" font-size="14" text-anchor="middle" fill="#b03a2e">arbre proche : grand sur l'écran</text>
<text x="760" y="378" font-size="14" text-anchor="middle" fill="#3b6ea5">même arbre, loin : plus petit</text>
<!-- zoom encart -->
<rect x="560" y="60" width="300" height="80" fill="#f3f0e8" stroke="#ccc"/>
<text x="710" y="86" font-size="14" text-anchor="middle" fill="#222">Sur l'écran, chaque objet occupe</text>
<text x="710" y="106" font-size="14" text-anchor="middle" fill="#222">l'écart entre ses deux rayons :</text>
<text x="710" y="126" font-size="14" text-anchor="middle" fill="#222">plus il est loin, plus l'écart est serré.</text>
<rect x="40" y="398" width="820" height="32" fill="#f3f0e8" stroke="#ccc"/>
<text x="450" y="420" font-size="14" text-anchor="middle" fill="#222">La caméra de la carte voit un cône de 32° de haut, de 0,5 à 2000 unités de la scène devant elle.</text>
</svg>
