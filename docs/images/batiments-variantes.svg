<rect width="900" height="350" fill="#ffffff"/><circle cx="32" cy="40" r="13" fill="#1f2a44"/><text x="32" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text><text x="52" y="46" font-weight="bold" font-size="16">« aucun » : à plat</text><text x="20" y="260" font-size="14">Le bâti est peint à l'encre</text><text x="20" y="280" font-size="14">bleue sur le sol.</text><text x="20" y="300" font-size="14">Pas de hauteur, pas d'ombre.</text><text x="20" y="320" font-size="14">Le moins cher.</text><polygon points="24.5,145.0 184.5,145.0 261.5,215.0 101.5,215.0" fill="#f4f1ea" stroke="#1f2a44" stroke-width="1.5" stroke-linejoin="round"/><polygon points="115.5,155.0 165.5,155.0 187.5,175.0 137.5,175.0" fill="#3b5b9a" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round" fill-opacity="0.55"/><polygon points="61.0,160.0 101.0,160.0 117.5,175.0 77.5,175.0" fill="#3b5b9a" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round" fill-opacity="0.55"/><polygon points="101.3,187.5 136.3,187.5 155.5,205.0 120.5,205.0" fill="#3b5b9a" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round" fill-opacity="0.55"/><polygon points="161.3,187.5 206.3,187.5 228.3,207.5 183.3,207.5" fill="#3b5b9a" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round" fill-opacity="0.55"/><circle cx="327" cy="40" r="13" fill="#1f2a44"/><text x="327" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text><text x="347" y="46" font-weight="bold" font-size="16">Parallaxe (abandonnée)</text><text x="315" y="260" font-size="14">Le sol reste plat : l'ordinateur</text><text x="315" y="280" font-size="14">dessine un trompe-l'œil</text><text x="315" y="300" font-size="14">pixel par pixel.</text><text x="315" y="320" font-size="14">Joli, mais ~2,7× plus cher.</text><polygon points="319.5,145.0 479.5,145.0 556.5,215.0 396.5,215.0" fill="#f4f1ea" stroke="#1f2a44" stroke-width="1.5" stroke-linejoin="round"/><polygon points="410.5,155.0 460.5,155.0 482.5,175.