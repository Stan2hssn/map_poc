<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="sans-serif" font-size="15" fill="#222">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <pattern id="g1" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60,0 L0,0 0,60" fill="none" stroke="#222" stroke-width="1.5"/></pattern>
    <pattern id="g2" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30,0 L0,0 0,30" fill="none" stroke="#222" stroke-width="1"/></pattern>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold">La même Terre, découpée de plus en plus fin</text>
  <text x="440" y="60" text-anchor="middle" font-size="15" fill="#555">La zone grise = les seules tuiles qu'on télécharge pour la vue (rectangle rouge)</text>

  <!-- Niveau 0 : 2 x 1 -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="240" height="120" fill="#e2e2e2"/>
    <rect x="0" y="0" width="240" height="120" fill="none" stroke="#222" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="120" stroke="#222" stroke-width="2"/>
    <rect x="96" y="35" width="40" height="30" fill="none" stroke="#b03a2e" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="120" y="160" text-anchor="middle" font-weight="bold">Niveau 0</text>
    <text x="120" y="182" text-anchor="middle">2 tuiles pour le monde</text>
    <text x="120" y="204" text-anchor="middle" fill="#555">on en charge 2</text>
  </g>

  <!-- Niveau 1 : 4 x 2 -->
  <g transform="translate(320,110)">
    <rect x="60" y="0" width="120" height="120" fill="#e2e2e2"/>
    <rect x="0" y="0" width="240" height="120" fill="url(#g1)"/>
    <rect x="0" y="0" width="240" height="120" fill="none" stroke="#222" stroke-width="2"/>
    <rect x="96" y="35" width="40" height="30" fill="none" stroke="#b03a2e" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="120" y="160" text-anchor="middle" font-weight="bold">Niveau 1</text>
    <text x="120" y="182" text-anchor="middle">8 tuiles (× 4)</text>
    <text x="120" y="204" text-anchor="middle" fill="#555">on en charge 4</text>
  </g>

  <!-- Niveau 2 : 8 x 4 -->
  <g transform="translate(600,110)">
    <rect x="90" y="30" width="60" height="60" fill="#e2e2e2"/>
    <rect x="0" y="0" width="240" height="120" fill="url(#g2)"/>
    <rect x="0" y="0" width="240" height="120" fill="none" stroke="#222" stroke-width="2"/>
    <rect x="96" y="35" width="40" height="30" fill="none" stroke="#b03a2e" stroke-width="3" stroke-dasharray="6 3"/>
    <text x="120" y="160" text-anchor="middle" font-weight="bold">Niveau 2</text>
    <text x="120" y="182" text-anchor="middle">32 tuiles (× 4)</text>
    <text x="120" y="204" text-anchor="middle" fill="#555">on en charge 4</text>
  </g>

  <line x1="285" y1="170" x2="315" y2="170" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="565" y1="170" x2="595" y2="170" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>

  <!-- Encadre du bas -->
  <rect x="40" y="345" width="800" height="100" rx="8" fill="#f6f6f6" stroke="#999" stroke-width="1.5"/>
  <text x="60" y="375">Chaque niveau coupe chaque tuile en 4 : 4 fois plus de tuiles, 2 fois plus de détail.</text>
  <text x="60" y="400">Au niveau 14 (le plus fin), le monde compte 32 768 × 16 384 ≈ 537 millions de tuiles.</text>
  <text x="60" y="425" font-weight="bold">Pour une vue de 40 km : de 13 à une centaine de tuiles, selon la finesse.</text>
</svg>
