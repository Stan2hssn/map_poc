<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="sans-serif" font-size="15" fill="#222">
  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold">Une tuile d'altitude : une image où chaque pixel est un nombre</text>

  <!-- Photo -->
  <text x="150" y="80" text-anchor="middle" font-weight="bold">Une photo</text>
  <g transform="translate(60,95)">
    <rect x="0" y="0" width="45" height="45" fill="#6f8f4e"/><rect x="45" y="0" width="45" height="45" fill="#8aa765"/><rect x="90" y="0" width="45" height="45" fill="#a7b98a"/><rect x="135" y="0" width="45" height="45" fill="#cfd6c2"/>
    <rect x="0" y="45" width="45" height="45" fill="#5d7c41"/><rect x="45" y="45" width="45" height="45" fill="#7d9a58"/><rect x="90" y="45" width="45" height="45" fill="#9bb07c"/><rect x="135" y="45" width="45" height="45" fill="#b9c6a8"/>
    <rect x="0" y="90" width="45" height="45" fill="#4f6d38"/><rect x="45" y="90" width="45" height="45" fill="#6c8a4c"/><rect x="90" y="90" width="45" height="45" fill="#7d9bb8"/><rect x="135" y="90" width="45" height="45" fill="#6a8db0"/>
    <rect x="0" y="135" width="45" height="45" fill="#43602f"/><rect x="45" y="135" width="45" height="45" fill="#7d9bb8"/><rect x="90" y="135" width="45" height="45" fill="#5f84a8"/><rect x="135" y="135" width="45" height="45" fill="#5f84a8"/>
    <rect x="0" y="0" width="180" height="180" fill="none" stroke="#222" stroke-width="2"/>
  </g>
  <text x="150" y="300" text-anchor="middle">chaque pixel = une couleur</text>
  <text x="150" y="322" text-anchor="middle" fill="#555">(rouge, vert, bleu)</text>

  <line x1="265" y1="185" x2="335" y2="185" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <text x="300" y="170" text-anchor="middle" fill="#555">au lieu de</text>

  <!-- Grille de nombres -->
  <text x="530" y="80" text-anchor="middle" font-weight="bold">Une tuile d'altitude (extrait 4 × 4)</text>
  <g transform="translate(350,95)" font-size="17" text-anchor="middle">
    <rect x="0" y="0" width="90" height="45" fill="#969696"/><rect x="90" y="0" width="90" height="45" fill="#a2a2a2"/><rect x="180" y="0" width="90" height="45" fill="#b5b5b5"/><rect x="270" y="0" width="90" height="45" fill="#d3d3d3"/>
    <rect x="0" y="45" width="90" height="45" fill="#9d9d9d"/><rect x="90" y="45" width="90" height="45" fill="#b0b0b0"/><rect x="180" y="45" width="90" height="45" fill="#cecece"/><rect x="270" y="45" width="90" height="45" fill="#ececec"/>
    <rect x="0" y="90" width="90" height="45" fill="#aaaaaa"/><rect x="90" y="90" width="90" height="45" fill="#bbbbbb"/><rect x="180" y="90" width="90" height="45" fill="#e8e8e8"/><rect x="270" y="90" width="90" height="45" fill="#ffffff"/>
    <rect x="0" y="135" width="90" height="45" fill="#b6b6b6"/><rect x="90" y="135" width="90" height="45" fill="#d9d9d9"/><rect x="180" y="135" width="90" height="45" fill="#ffffff"/><rect x="270" y="135" width="90" height="45" fill="#ffffff"/>
    <text x="45" y="29">1 710</text><text x="135" y="29">1 588</text><text x="225" y="29">1 402</text><text x="315" y="29">1 105</text>
    <text x="45" y="74">1 640</text><text x="135" y="74">1 455</text><text x="225" y="74">1 160</text><text x="315" y="74">870</text>
    <text x="45" y="119">1 512</text><text x="135" y="119">1 340</text><text x="225" y="119">905</text><text x="315" y="119" fill="#888">vide</text>
    <text x="45" y="164">1 388</text><text x="135" y="164">1 050</text><text x="225" y="164" fill="#888">vide</text><text x="315" y="164" fill="#888">vide</text>
    <g stroke="#222" stroke-width="1"><line x1="90" y1="0" x2="90" y2="180"/><line x1="180" y1="0" x2="180" y2="180"/><line x1="270" y1="0" x2="270" y2="180"/><line x1="0" y1="45" x2="360" y2="45"/><line x1="0" y1="90" x2="360" y2="90"/><line x1="0" y1="135" x2="360" y2="135"/></g>
    <rect x="0" y="0" width="360" height="180" fill="none" stroke="#222" stroke-width="2"/>
  </g>
  <text x="530" y="300" text-anchor="middle">chaque pixel = une altitude en mètres</text>
  <text x="530" y="322" text-anchor="middle" fill="#555">plus clair = plus bas ; « vide » = la mer, ou rien de mesuré</text>
  <!-- Encadre chiffres -->
  <rect x="40" y="355" width="800" height="125" rx="8" fill="#f6f6f6" stroke="#999" stroke-width="1.5"/>
  <text x="60" y="385">Une vraie tuile : 256 × 256 pixels = 65 536 altitudes.</text>
  <text x="60" y="412">Reçue de l'IGN : 4 octets par altitude = 256 Ko.</text>
  <text x="60" y="439">Gardée en mémoire en « demi-nombre » : 2 octets = 128 Ko, deux fois moins.</text>
  <text x="60" y="466" fill="#555">On garde jusqu'à 320 tuiles : environ 40 Mo au lieu de 80.</text>
</svg>
