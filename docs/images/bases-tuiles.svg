<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Les tuiles : le monde découpé en carreaux, de plus en plus fins</text>
<text x="150" y="62" font-size="13" text-anchor="middle" fill="#555">longitude -180° → +180°, latitude +90° → -90°</text>
<rect x="40" y="100" width="220" height="110" fill="#f3f0e8" stroke="#222" stroke-width="2"/><rect x="150.0" y="100.0" width="110.0" height="110.0" fill="#c9b9a0" stroke="#b03a2e" stroke-width="2.5"/><line x1="150.0" y1="100" x2="150.0" y2="210" stroke="#222" stroke-width="1.2"/><text x="150.0" y="88" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Niveau 0</text><text x="150.0" y="236" font-size="14" text-anchor="middle" fill="#222">2 × 1 = 2 tuiles</text><text x="150.0" y="256" font-size="14" text-anchor="middle" fill="#555">1 point d'altitude ≈ 78 km</text><rect x="330" y="100" width="220" height="110" fill="#f3f0e8" stroke="#222" stroke-width="2"/><rect x="440.0" y="100.0" width="55.0" height="55.0" fill="#c9b9a0" stroke="#b03a2e" stroke-width="2.5"/><line x1="385.0" y1="100" x2="385.0" y2="210" stroke="#222" stroke-width="1.2"/><line x1="440.0" y1="100" x2="440.0" y2="210" stroke="#222" stroke-width="1.2"/><line x1="495.0" y1="100" x2="495.0" y2="210" stroke="#222" stroke-width="1.2"/><line x1="330" y1="155.0" x2="550" y2="155.0" stroke="#222" stroke-width="1.2"/><text x="440.0" y="88" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Niveau 1</text><text x="440.0" y="236" font-size="14" text-anchor="middle" fill="#222">4 × 2 = 8 tuiles</text><text x="440.0" y="256" font-size="14" text-anchor="middle" fill="#555">1 point d'altitude ≈ 39 km</text><rect x="620" y="100" width="220" height="110" fill="#f3f0e8" stroke="#222" stroke-width="2"/><rect x="730.0" y="100.0" width="27.5" height="27.5" fill="#c9b9a0" stroke="#b03a2e" stroke-width="2.5"/><line x1="647.5" y1="100" x2="647.5" y2="210" stroke="#222" stroke-width="1.2"/><line x1="675.0" y1="100" x2="675.0" y2="210" stroke="#222" stroke-width="1.2"/><line x1="702.5" y1="100" x2="702.5" y2="210" stroke="#222" stroke-width="1.2"/><line x1="730.0" y1="100" x2="730.0" y2="210" stroke="#222" stroke-width="1.2"/><line x1="757.5" y1="100" x2="757.5" y2="210" stroke="#222" stroke-width="1.2"/><line x1="785.0" y1="100" x2="785.0" y2="210" stroke="#222" stroke-width="1.2"/><line x1="812.5" y1="100" x2="812.5" y2="210" stroke="#222" stroke-width="1.2"/><line x1="620" y1="127.5" x2="840" y2="127.5" stroke="#222" stroke-width="1.2"/><line x1="620" y1="155.0" x2="840" y2="155.0" stroke="#222" stroke-width="1.2"/><line x1="620" y1="182.5" x2="840" y2="182.5" stroke="#222" stroke-width="1.2"/><text x="730.0" y="88" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Niveau 2</text><text x="730.0" y="236" font-size="14" text-anchor="middle" fill="#222">8 × 4 = 32 tuiles</text><text x="730.0" y="256" font-size="14" text-anchor="middle" fill="#555">1 point d'altitude ≈ 20 km</text>
<path d="M 272 155 L 318 155" stroke="#222" stroke-width="2.5" fill="none"/><path d="M 310 148 L 320 155 L 310 162" stroke="#222" stroke-width="2.5" fill="none"/><text x="295" y="140" font-size="13" text-anchor="middle" fill="#555">× 4</text><path d="M 562 155 L 608 155" stroke="#222" stroke-width="2.5" fill="none"/><path d="M 600 148 L 610 155 L 600 162" stroke="#222" stroke-width="2.5" fill="none"/><text x="585" y="140" font-size="13" text-anchor="middle" fill="#555">× 4</text>
<text x="450" y="292" font-size="14" text-anchor="middle" fill="#b03a2e">en rouge : la tuile qui contient les Cévennes (vue de départ) à chaque niveau</text>
<rect x="40" y="312" width="820" height="140" fill="#f3f0e8" stroke="#ccc"/>
<text x="60" y="340" font-size="15" fill="#222">Chaque niveau coupe chaque tuile en 4. Chaque tuile est une petite image de 256 × 256 altitudes.</text>
<text x="60" y="368" font-size="15" fill="#222">Niveau 0 : une tuile couvre 180° de côté, un point ≈ 78 km.</text>
<text x="60" y="396" font-size="15" fill="#222">Niveau 14 (le plus fin ici) : 32 768 × 16 384 tuiles, un point ≈ 4,8 m.</text>
<text x="60" y="424" font-size="15" fill="#222">On ne charge que les tuiles visibles, au niveau qui correspond au zoom.</text>
</svg>