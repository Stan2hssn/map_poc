<rect width="900" height="350" fill="#ffffff"/><circle cx="40" cy="40" r="13" fill="#1f2a44"/><text x="40" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">1</text><text x="62" y="46" font-weight="bold" font-size="17">Le contour au sol</text><text x="40" y="78" font-size="14">6 points lus dans le plan IGN</text><text x="40" y="98" font-size="14">+ une hauteur : 18 m</text><polygon points="60.0,120.0 192.0,120.0 192.0,175.0 115.0,175.0 115.0,241.0 60.0,241.0" fill="#dfe6f3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="120" r="4.5" fill="#1f2a44"/><circle cx="192" cy="120" r="4.5" fill="#1f2a44"/><circle cx="192" cy="175" r="4.5" fill="#1f2a44"/><circle cx="115" cy="175" r="4.5" fill="#1f2a44"/><circle cx="115" cy="241" r="4.5" fill="#1f2a44"/><circle cx="60" cy="241" r="4.5" fill="#1f2a44"/><text x="90" y="280" font-size="14" font-style="italic">vu du dessus</text><line x1="250" y1="200" x2="300" y2="200" stroke="#1f2a44" stroke-width="2" marker-end="url(#a)"/><circle cx="330" cy="40" r="13" fill="#1f2a44"/><text x="330" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">2</text><text x="352" y="46" font-weight="bold" font-size="17">On le pousse vers le haut</text><polygon points="330.0,210.0 450.0,210.0 477.5,235.0 407.5,235.0 440.5,265.0 390.5,265.0" fill="#dfe6f3" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 4"/><polygon points="330.0,130.0 450.0,130.0 477.5,155.0 407.5,155.0 440.5,185.0 390.5,185.0" fill="none" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><line x1="330" y1="210" x2="330" y2="136" stroke="#1f2a44" stroke-width="1.6" marker-end="url(#a)"/><line x1="477.5" y1="235" x2="477.5" y2="161" stroke="#1f2a44" stroke-width="1.6" marker-end="url(#a)"/><line x1="440.5" y1="265" x2="440.5" y2="191" stroke="#1f2a44" stroke-width="1.6" marker-end="url(#a)"/><line x1="390.5" y1="265" x2="390.5" y2="191" stroke="#1f2a44" stroke-width="1.6" marker-end="url(#a)"/><text x="330" y="315" font-size="14">chaque point du contour</text><text x="330" y="335" font-size="14">est recopié 18 m plus haut</text><line x1="560" y1="200" x2="610" y2="200" stroke="#1f2a44" stroke-width="2" marker-end="url(#a)"/><circle cx="630" cy="40" r="13" fill="#1f2a44"/><text x="630" y="45" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">3</text><text x="652" y="46" font-weight="bold" font-size="17">Un toit + des murs</text><polygon points="777.5,235.0 707.5,235.0 707.5,155.0 777.5,155.0" fill="#cfc8bc" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="690.5,265.0 630.0,210.0 630.0,130.0 690.5,185.0" fill="#b9b1a4" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="740.5,265.0 690.5,265.0 690.5,185.0 740.5,185.0" fill="#cfc8bc" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><polygon points="630.0,130.0 750.0,130.0 777.5,155.0 707.5,155.0 740.5,185.0 690.5,185.0" fill="#ece8e1" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/><line x1="630" y1="130" x2="777.5" y2="155" stroke="#3b5b9a" stroke-width="2" stroke-dasharray="6 4"/><line x1="630" y1="130" x2="707.5" y2="155" stroke="#3b5b9a" stroke-width="2" stroke-dasharray="6 4"/><line x1="707.5" y1="155" x2="690.5" y2="185" stroke="#3b5b9a" stroke-width="2" stroke-dasharray="6 4"/><text x="700" y="112" font-size="14" fill="#3b5b9a" font-weight="bold">toit : 4 triangles</text><line x1="745" y1="118" x2="735" y2="138.5" stroke="#3b5b9a" stroke-width="1.5"/><text x="630" y="315" font-size="14">mur = 1 rectangle par côté</text><text x="630" y="335" font-size="14">du contour (2 triangles)</text></svg>