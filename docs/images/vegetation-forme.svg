<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="sans-serif" fill="#222">
  <rect width="900" height="400" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#222"/></marker>
  </defs>

  <!-- 1. Feuillu -->
  <text x="140" y="38" text-anchor="middle" font-size="17" font-weight="bold">1. Feuillu</text>
  <path d="M30,300 Q90,292 140,298 T260,294" fill="none" stroke="#7a6a50" stroke-width="2.5"/>
  <ellipse cx="140" cy="185" rx="60" ry="51" fill="#a9b197" stroke="#222" stroke-width="2"/>
  <line x1="140" y1="236" x2="140" y2="297" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="150" y="275" font-size="14" fill="#555">pas de tronc</text>
  <line x1="140" y1="185" x2="200" y2="185" stroke="#222" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="170" y="179" text-anchor="middle" font-size="14">r</text><circle cx="140" cy="185" r="2.5" fill="#222"/>
  <text x="140" y="330" text-anchor="middle" font-size="14">boule un peu aplatie (85 % de haut)</text>
  <text x="140" y="350" text-anchor="middle" font-size="14">centre à 1,7 × r du sol</text>

  <!-- 2. Conifere -->
  <text x="420" y="38" text-anchor="middle" font-size="17" font-weight="bold">2. Conifère</text>
  <path d="M310,300 Q370,292 420,298 T540,294" fill="none" stroke="#7a6a50" stroke-width="2.5"/>
  <ellipse cx="420" cy="192" rx="27" ry="90" fill="#6c7463" stroke="#222" stroke-width="2"/>
  <line x1="420" y1="282" x2="420" y2="297" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="420" y="330" text-anchor="middle" font-size="14">fuseau étroit, 3 × plus haut que large</text>
  <text x="420" y="350" text-anchor="middle" font-size="14">teinte plus sombre</text>

  <!-- 3. Vent -->
  <text x="720" y="38" text-anchor="middle" font-size="17" font-weight="bold">3. Le vent</text>
  <path d="M610,300 Q670,292 720,298 T840,294" fill="none" stroke="#7a6a50" stroke-width="2.5"/>
  <ellipse cx="707" cy="185" rx="60" ry="51" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <ellipse cx="733" cy="185" rx="60" ry="51" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <ellipse cx="720" cy="185" rx="60" ry="51" fill="#a9b197" stroke="#222" stroke-width="2"/>
  <line x1="660" y1="110" x2="780" y2="110" stroke="#222" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="720" y="98" text-anchor="middle" font-size="14">va-et-vient</text>
  <text x="720" y="330" text-anchor="middle" font-size="14">la boule glisse de ± 22 % de son rayon</text>
  <text x="720" y="350" text-anchor="middle" font-size="14">décalé selon la place de l'arbre</text>

  <text x="450" y="385" text-anchor="middle" font-size="14" fill="#444">Le même modèle, étiré différemment selon la forme : la carte graphique fait l'étirement et le vent elle-même.</text>
</svg>
