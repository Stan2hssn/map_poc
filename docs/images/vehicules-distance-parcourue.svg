<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Une route = une suite de segments ; la voiture = une distance</text>
  <polyline points="60,300 220,200 340,250 560,140 740,190" fill="none" stroke="#bbb" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="60,300 220,200 340,250 560,140 740,190" fill="none" stroke="#222" stroke-width="2"/>
  <g fill="#222">
    <circle cx="60" cy="300" r="6"/><circle cx="220" cy="200" r="6"/><circle cx="340" cy="250" r="6"/><circle cx="560" cy="140" r="6"/><circle cx="740" cy="190" r="6"/>
  </g>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="128" y="236">120 m</text>
    <text x="292" y="207">80 m</text>
    <text x="480" y="170">150 m</text>
    <text x="664" y="152">60 m</text>
  </g>
  <g font-size="15" fill="#1a4f8a" text-anchor="middle" font-weight="bold">
    <text x="60" y="330">0 m</text>
    <text x="220" y="182">120 m</text>
    <text x="340" y="280">200 m</text>
    <text x="560" y="122">350 m</text>
    <text x="740" y="220">410 m</text>
  </g>
  <g transform="translate(428,206) rotate(-26.6)">
    <rect x="-16" y="-8" width="32" height="16" rx="3" fill="#c0392b" stroke="#222" stroke-width="1.5"/>
  </g>
  <line x1="428" y1="206" x2="428" y2="262" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="436" y="262" font-size="15" fill="#c0392b" font-weight="bold">d = 260 m</text>
  <line x1="90" y1="345" x2="250" y2="345" stroke="#222" stroke-width="2" marker-end="url(#fl)"/>
  <text x="90" y="366" font-size="14" fill="#222">sens du tracé</text>
  <rect x="300" y="300" width="470" height="150" rx="8" fill="#f6f6f2" stroke="#999"/>
  <g font-size="15" fill="#222">
    <text x="316" y="326">1. On cumule les longueurs : 0, 120, 200, 350, 410 m</text>
    <text x="316" y="354">2. La voiture a parcouru d = 260 m depuis le début</text>
    <text x="316" y="382">3. 260 est entre 200 et 350 : c'est le 3e segment</text>
    <text x="316" y="410">4. (260 − 200) ÷ 150 = 0,4 : à 40 % du segment</text>
    <text x="316" y="436">5. Chaque image : d = d + vitesse × temps écoulé</text>
  </g>
</svg>
