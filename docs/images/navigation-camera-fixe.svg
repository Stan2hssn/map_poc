<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <clipPath id="ca"><rect x="45" y="90" width="340" height="250"/></clipPath>
  </defs>
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="32" font-size="20" font-weight="bold" fill="#222" text-anchor="middle">La caméra reste à sa place : c'est la carte qu'on fait glisser ou grossir dessous</text>

  <!-- Panneau A : glisser -->
  <text x="215" y="70" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">1. Glisser</text>
  <rect x="45" y="90" width="340" height="250" fill="none" stroke="#222" stroke-width="4"/>
  <text x="55" y="112" font-size="14" fill="#222">l'écran (fixe)</text>
  <g fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="6 5">
    <path d="M90,300 C150,250 180,280 230,220 S300,170 340,150"/>
    <circle cx="160" cy="180" r="12"/>
    <circle cx="290" cy="270" r="9"/>
  </g>
  <g fill="none" stroke="#222" stroke-width="3" clip-path="url(#ca)">
    <path d="M150,300 C210,250 240,280 290,220 S360,170 400,150" stroke="#1f4e79"/>
    <circle cx="220" cy="180" r="12" fill="#222"/>
    <circle cx="350" cy="270" r="9" fill="#222"/>
  </g>
  <line x1="172" y1="180" x2="204" y2="180" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="300" y1="270" x2="337" y2="270" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
  <path d="M215,198 l6,-2 l0,14 l4,-4 l4,9 l3,-1 l-4,-9 l6,0 z" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="215" y="368" font-size="14" fill="#222" text-anchor="middle">Le point attrapé (la ville) reste sous le doigt.</text>
  <text x="215" y="388" font-size="14" fill="#222" text-anchor="middle">Toute la carte avance d'autant ; l'écran, lui, n'a pas bougé.</text>

  <!-- Panneau B : zoomer -->
  <text x="645" y="70" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">2. Zoomer sous la souris</text>
  <rect x="475" y="90" width="340" height="250" fill="none" stroke="#222" stroke-width="4"/>
  <text x="485" y="112" font-size="14" fill="#222">l'écran (fixe)</text>
  <g fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="6 5">
    <circle cx="560" cy="175" r="8"/>
    <circle cx="700" cy="185" r="8"/>
    <circle cx="680" cy="265" r="8"/>
  </g>
  <g fill="#222">
    <circle cx="520" cy="155" r="11"/>
    <circle cx="730" cy="170" r="11"/>
    <circle cx="700" cy="305" r="11"/>
  </g>
  <g stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#a)">
    <line x1="553" y1="170" x2="532" y2="159"/>
    <line x1="708" y1="181" x2="719" y2="175"/>
    <line x1="683" y1="273" x2="694" y2="293"/>
  </g>
  <circle cx="630" cy="215" r="8" fill="#c0392b"/>
  <path d="M630,215 l6,-2 l0,14 l4,-4 l4,9 l3,-1 l-4,-9 l6,0 z" transform="translate(2,4)" fill="#ffffff" stroke="#222" stroke-width="1.5"/>
  <text x="645" y="368" font-size="14" fill="#222" text-anchor="middle">Le point sous la souris (rouge) ne bouge pas ;</text>
  <text x="645" y="388" font-size="14" fill="#222" text-anchor="middle">tout le reste s'écarte de lui (ou s'en rapproche).</text>

  <g font-size="14" fill="#222">
    <line x1="60" y1="432" x2="100" y2="432" stroke="#aaa" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="110" y="437">la carte avant le geste</text>
    <line x1="320" y1="432" x2="360" y2="432" stroke="#222" stroke-width="3"/>
    <text x="370" y="437">la carte après</text>
    <line x1="530" y1="432" x2="570" y2="432" stroke="#c0392b" stroke-width="3" marker-end="url(#a)"/>
    <text x="580" y="437">ce qui se déplace</text>
  </g>
</svg>
