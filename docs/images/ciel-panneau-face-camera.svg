<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="880" height="620" font-family="sans-serif" font-size="15" fill="#222">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <rect width="880" height="620" fill="#fff"/>
  <text x="30" y="34" font-size="19" font-weight="bold">1. Vu de dessus : chaque nuage pivote pour faire face à la caméra</text>
  <!-- camera -->
  <g transform="translate(140,170)">
    <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
    <path d="M22,-8 L36,-14 L36,14 L22,8 z" fill="#fff" stroke="#222" stroke-width="2"/>
  </g>
  <text x="95" y="215">caméra</text>
  <!-- panels: lines perpendicular to direction from camera -->
  <g stroke="#222" stroke-width="5" stroke-linecap="round">
    <line x1="430" y1="70" x2="466" y2="122"/>
    <line x1="520" y1="150" x2="520" y2="200"/>
    <line x1="440" y1="250" x2="470" y2="218"/>
  </g>
  <g stroke="#888" stroke-dasharray="5 5" stroke-width="1.5">
    <line x1="180" y1="165" x2="440" y2="100"/>
    <line x1="180" y1="170" x2="510" y2="175"/>
    <line x1="180" y1="176" x2="450" y2="236"/>
  </g>
  <text x="560" y="110">un nuage = un panneau plat</text>
  <text x="560" y="132">(un rectangle à 2 triangles)</text>
  <text x="560" y="175">il tourne seulement</text>
  <text x="560" y="197">autour de l'axe vertical</text>
  <text x="560" y="240">on le voit toujours de face</text>

  <text x="30" y="320" font-size="19" font-weight="bold">2. Le sens des triangles : face avant, face arrière</text>
  <!-- front triangle -->
  <g transform="translate(70,335)">
    <polygon points="20,190 120,30 220,190" fill="#eee" stroke="#222" stroke-width="2"/>
    <circle cx="20" cy="190" r="5"/><circle cx="120" cy="30" r="5"/><circle cx="220" cy="190" r="5"/>
    <text x="0" y="214">1</text><text x="228" y="214">2</text><text x="112" y="20">3</text>
    <path d="M150,135 A30,30 0 0,0 90,135" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
    <text x="0" y="238" font-weight="bold">1 → 2 → 3 : sens inverse des aiguilles</text>
  </g>
  <text x="70" y="600" font-size="15">= face avant : la carte graphique le dessine</text>
  <!-- back triangle -->
  <g transform="translate(480,335)">
    <polygon points="20,190 120,30 220,190" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="20" cy="190" r="5"/><circle cx="120" cy="30" r="5"/><circle cx="220" cy="190" r="5"/>
    <text x="0" y="214">1</text><text x="228" y="214">3</text><text x="112" y="20">2</text>
    <path d="M90,135 A30,30 0 0,1 150,135" fill="none" stroke="#222" stroke-width="2" marker-end="url(#a)"/>
    <text x="0" y="238" font-weight="bold">1 → 2 → 3 : sens des aiguilles</text>
  </g>
  <text x="490" y="600" font-size="15">= face arrière : jetée, rien ne s'affiche</text>
</svg>
